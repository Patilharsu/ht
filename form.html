<html>
<head>
    <title>AMZ Store | Register</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<nav class="navbar">
    <h1>AMZ<span>STORE</span></h1>
    <a href="index.html" class="nav-link">Login</a>
</nav>

<div class="register-container">

    <div class="register-heading">
        <div class="icon-circle">🛍️</div>
        <h2>Create Your Account</h2>
        <p>Join AMZ Store and start shopping today!</p>
    </div>

    <form id="registerForm">

        <div class="input-grid">

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="fullname"
                placeholder="Enter full name" required>
            </div>

            <div class="form-group">
                <label>Age</label>
                <input type="number" name="age"
                placeholder="Enter age" min="1" required>
            </div>

            <div class="form-group">
                <label>Contact Number</label>
                <input type="tel" name="phoneno"
                placeholder="10 digit mobile number"
                pattern="[0-9]{10}" required>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email"
                placeholder="Enter email address" required>
            </div>

            <div class="form-group">
                <label>Gender</label>
                <select name="gender" required>
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>Select City</label>
                <select name="city" required>
                    <option value="">Select City</option>
                    <option value="Pune">Pune</option>
                    <option value="Nashik">Nashik</option>
                    <option value="Mumbai">Mumbai</option>
                </select>
            </div>

            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username"
                placeholder="Create username" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password"
                placeholder="Create password"
                minlength="8" required>
            </div>

        </div>

        <button type="submit">CREATE ACCOUNT →</button>

    </form>

    <p class="bottom-text">
        Already have an account?
        <a href="index.html">Login Now</a>
    </p>

</div>

<footer>© 2026 AMZ STORE | All Rights Reserved</footer>

<script>
document.getElementById("registerForm")
.addEventListener("submit", function(event) {

    event.preventDefault();

    const formData = new FormData(this);

    const user = {
        fullname: formData.get("fullname"),
        age: formData.get("age"),
        phoneno: formData.get("phoneno"),
        email: formData.get("email"),
        gender: formData.get("gender"),
        city: formData.get("city"),
        username: formData.get("username")
    };

    localStorage.setItem("amzUser",
                         JSON.stringify(user));

    alert("Registration Successful!");

    window.location.href = "table.html";

});
</script>

</body>
</html>


</body>
</html>
